<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&family=Noto+Sans+KR:wght@500;700;900&display=block">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;font-family:'Noto Sans KR',sans-serif;word-break:keep-all}
section{width:1080px;height:1920px;position:relative;background:radial-gradient(120% 70% at 50% 10%,#2a2520,#0f0e0d 75%)}
.big{position:absolute;left:0;right:0;top:120px;text-align:center;font-family:'Nanum Myeongjo',serif;font-size:380px;line-height:1;color:transparent;-webkit-text-stroke:3px #c9a24e;opacity:.9}
.top{position:absolute;left:80px;right:80px;top:560px}
.tag{display:inline-block;background:#ffcb3d;color:#151515;font-weight:900;font-size:42px;padding:10px 24px}
.t{margin-top:26px;color:#fff;font-size:64px;font-weight:900;line-height:1.32}
.t em{font-style:normal;color:#ffcb3d}
.bot{position:absolute;left:80px;right:80px;bottom:200px;text-align:center}
.bot b{display:block;color:#fff;font-size:44px;font-weight:900;line-height:1.4}
.bot b span{color:#ffcb3d}
.bot small{display:block;margin-top:18px;color:#bfb6a6;font-size:32px;font-weight:500}
.line{position:absolute;left:50%;bottom:150px;width:240px;margin-left:-120px;height:2px;background:#c9a24e;opacity:.7}
</style></head><body><section id="a">
<div class="big">Q</div>
<div class="top"><span class="tag">남자어 번역 퀴즈</span>
<div class="t">식은 남자가 기념일에<br><em>"갖고 싶은 거 있어? 그냥 말해."</em><br>라고 하면?</div></div>
<div class="bot"><b>팔로워 3만 이벤트 맛보기</b></div>
<div class="line"></div>
</section></body></html>
