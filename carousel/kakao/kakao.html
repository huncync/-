<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@500;700;900&display=block">
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#222;word-break:keep-all;font-family:'Noto Sans KR';color:#f4f1ea}
.pen{font-family:'Nanum Pen Script';-webkit-text-stroke:1.2px currentColor;paint-order:stroke fill;line-height:1.05}
.a{color:#e0b46a}
#prof{width:640px;height:640px;background:radial-gradient(circle at 50% 42%,#2a2a2e 0%,#0b0b0c 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin-bottom:20px}
#prof .pen{font-size:116px}
#prof .s{margin-top:26px;font-size:36px;font-weight:900;color:#cfcac1;letter-spacing:.02em}
#bg{width:800px;height:500px;background:radial-gradient(ellipse at 50% 50%,#26262a 0%,#0b0b0c 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#bg .k{font-size:22px;font-weight:700;color:#8e8a83;letter-spacing:.14em}
#bg .t{font-size:52px;font-weight:900;letter-spacing:-0.03em;line-height:1.25;margin-top:14px}
#bg .pen{font-size:46px;margin-top:18px;color:#d6d1c8}
</style></head><body>
<div id="prof"><div class="pen">남자가 말하는<br><span class="a">남자심리</span></div><div class="s">남자들끼리 하는 말</div></div>
<div id="bg"><div class="k">남자들끼리 하는 말 · 1:1 상담</div><div class="t">그 남자 속마음,<br><span class="a">남자가 직접 번역해 드려요</span></div><div class="pen">관상 · 카톡 · 상황까지 보고, 보낼 말까지</div></div>
</body></html>
